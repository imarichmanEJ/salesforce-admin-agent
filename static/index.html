<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SF Guide Agent</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c10;
    --surface: #111418;
    --border: #1e2430;
    --accent: #0176d3;
    --accent-dim: #032d60;
    --green: #2e844a;
    --green-light: #3ba755;
    --text: #e8eaed;
    --text-dim: #7b8794;
    --user-bg: #032d60;
    --agent-bg: #111418;
    --font-mono: 'IBM Plex Mono', monospace;
    --font-sans: 'IBM Plex Sans', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }

  .logo {
    width: 32px;
    height: 32px;
    background: var(--accent);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 500;
    color: white;
    letter-spacing: -0.5px;
  }

  header h1 {
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.3px;
    color: var(--text);
  }

  header span {
    font-size: 12px;
    color: var(--text-dim);
    font-family: var(--font-mono);
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--green-light);
    margin-left: auto;
    box-shadow: 0 0 6px var(--green-light);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* Chat area */
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }

  #chat::-webkit-scrollbar { width: 4px; }
  #chat::-webkit-scrollbar-track { background: transparent; }
  #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .msg {
    display: flex;
    gap: 12px;
    max-width: 820px;
    animation: fadeIn 0.2s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user { flex-direction: row-reverse; margin-left: auto; }

  .avatar {
    width: 28px;
    height: 28px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 600;
    font-family: var(--font-mono);
    flex-shrink: 0;
    margin-top: 2px;
  }

  .msg.user .avatar {
    background: var(--accent-dim);
    color: #5ba4f5;
    border: 1px solid var(--accent);
  }

  .msg.agent .avatar {
    background: #1a2332;
    color: var(--text-dim);
    border: 1px solid var(--border);
  }

  .bubble {
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.65;
    max-width: calc(100% - 44px);
  }

  .msg.user .bubble {
    background: var(--user-bg);
    border: 1px solid var(--accent);
    color: #c9d9ef;
    border-radius: 8px 2px 8px 8px;
  }

  .msg.agent .bubble {
    background: var(--agent-bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 2px 8px 8px 8px;
  }

  /* Markdown 스타일 */
  .markdown h1 {
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    margin: 0 0 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  .markdown h2 {
    font-size: 14px;
    font-weight: 600;
    color: #5ba4f5;
    margin: 16px 0 8px;
  }

  .markdown h3 {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
    margin: 12px 0 6px;
  }

  .markdown p {
    margin: 6px 0;
  }

  .markdown ul, .markdown ol {
    margin: 6px 0 6px 20px;
  }

  .markdown li {
    margin: 4px 0;
  }

  .markdown code {
    background: #1a2332;
    color: #7ec8e3;
    padding: 2px 6px;
    border-radius: 3px;
    font-family: var(--font-mono);
    font-size: 12px;
  }

  .markdown pre {
    background: #1a2332;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    margin: 8px 0;
    overflow-x: auto;
  }

  .markdown pre code {
    background: none;
    padding: 0;
    color: #c8d8e8;
    font-size: 12px;
  }

  .markdown strong {
    color: var(--text);
    font-weight: 600;
  }

  .markdown hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 12px 0;
  }

  .markdown blockquote {
    border-left: 3px solid var(--accent);
    padding-left: 12px;
    color: var(--text-dim);
    margin: 8px 0;
  }

  .markdown table {
    width: 100%;
    border-collapse: collapse;
    margin: 8px 0;
    font-size: 13px;
  }

  .markdown th {
    background: #1a2332;
    color: #5ba4f5;
    padding: 8px 12px;
    text-align: left;
    border: 1px solid var(--border);
  }

  .markdown td {
    padding: 7px 12px;
    border: 1px solid var(--border);
    color: var(--text-dim);
  }

  .markdown tr:nth-child(even) td {
    background: #0d1117;
  }

  /* Typing indicator */
  .typing {
    display: flex;
    gap: 12px;
    align-items: center;
    max-width: 820px;
  }

  .typing .avatar {
    width: 28px;
    height: 28px;
    border-radius: 4px;
    background: #1a2332;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-family: var(--font-mono);
    color: var(--text-dim);
    flex-shrink: 0;
  }

  .typing-dots {
    display: flex;
    gap: 5px;
    padding: 14px 16px;
    background: var(--agent-bg);
    border: 1px solid var(--border);
    border-radius: 2px 8px 8px 8px;
  }

  .typing-dots span {
    width: 6px;
    height: 6px;
    background: var(--text-dim);
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }

  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  /* Input area */
  footer {
    padding: 16px 24px 20px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }

  .input-wrap {
    display: flex;
    gap: 10px;
    max-width: 820px;
  }

  textarea {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 14px;
    padding: 11px 14px;
    resize: none;
    outline: none;
    min-height: 44px;
    max-height: 120px;
    transition: border-color 0.15s;
    line-height: 1.5;
  }

  textarea:focus { border-color: var(--accent); }
  textarea::placeholder { color: var(--text-dim); }

  button#send {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 0 18px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    font-family: var(--font-sans);
    transition: background 0.15s;
    white-space: nowrap;
    align-self: flex-end;
    height: 44px;
  }

  button#send:hover { background: #0264b8; }
  button#send:disabled { background: #1a2d45; color: var(--text-dim); cursor: not-allowed; }

  button#reset {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0 14px;
    font-size: 12px;
    font-family: var(--font-mono);
    cursor: pointer;
    height: 44px;
    align-self: flex-end;
    transition: all 0.15s;
  }

  button#reset:hover { border-color: var(--text-dim); color: var(--text); }

  .hint {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 8px;
    font-family: var(--font-mono);
  }

  /* Welcome */
  .welcome {
    text-align: center;
    padding: 48px 24px;
    color: var(--text-dim);
  }

  .welcome h2 {
    font-size: 18px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 8px;
  }

  .welcome p {
    font-size: 13px;
    line-height: 1.6;
    max-width: 420px;
    margin: 0 auto 24px;
  }

  .examples {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    max-width: 600px;
    margin: 0 auto;
  }

  .example-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 20px;
    padding: 7px 14px;
    font-size: 12px;
    cursor: pointer;
    font-family: var(--font-sans);
    transition: all 0.15s;
  }

  .example-btn:hover {
    border-color: var(--accent);
    color: var(--text);
  }
</style>
</head>
<body>

<header>
  <div class="logo">SF</div>
  <h1>SF Guide Agent</h1>
  <span>/ Salesforce Admin Assistant</span>
  <div class="status-dot"></div>
</header>

<div id="chat">
  <div class="welcome" id="welcome">
    <h2>어떤 걸 Salesforce에서 구현하고 싶으신가요?</h2>
    <p>Use case를 자유롭게 설명해주세요. 필요한 기능을 분석하고 단계별 구현 가이드를 제공해드립니다.</p>
    <div class="examples">
      <button class="example-btn" onclick="setInput(this.textContent)">고객 정보를 AI로 요약해서 필드에 표시하고 싶어</button>
      <button class="example-btn" onclick="setInput(this.textContent)">기회 단계가 바뀌면 자동으로 이메일 보내고 싶어</button>
      <button class="example-btn" onclick="setInput(this.textContent)">신규 리드 생성 시 담당자를 자동 배정하고 싶어</button>
      <button class="example-btn" onclick="setInput(this.textContent)">Account 페이지에 관련 케이스 수를 보여주고 싶어</button>
    </div>
  </div>
</div>

<footer>
  <div class="input-wrap">
    <textarea id="input" placeholder="Use case를 입력하세요..." rows="1"></textarea>
    <button id="send" onclick="sendMessage()">전송</button>
    <button id="reset" onclick="resetSession()">초기화</button>
  </div>
  <div class="hint">Enter to send · Shift+Enter for newline</div>
</footer>

<script>
  // marked 설정
  marked.setOptions({
    breaks: true,
    gfm: true,
  });

  const sessionId = 'session_' + Math.random().toString(36).slice(2);
  const chatEl = document.getElementById('chat');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  let isLoading = false;

  // Auto-resize textarea
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  });

  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  function setInput(text) {
    inputEl.value = text;
    inputEl.dispatchEvent(new Event('input'));
    inputEl.focus();
  }

  function addMessage(role, content) {
    const welcome = document.getElementById('welcome');
    if (welcome) welcome.remove();

    const msg = document.createElement('div');
    msg.className = `msg ${role}`;
    const label = role === 'user' ? 'YOU' : 'SF';

    const bubbleContent = role === 'agent'
      ? marked.parse(content)
      : escapeHtml(content);

    const bubbleClass = role === 'agent' ? 'bubble markdown' : 'bubble';

    msg.innerHTML = `
      <div class="avatar">${label}</div>
      <div class="${bubbleClass}">${bubbleContent}</div>
    `;
    chatEl.appendChild(msg);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function showTyping() {
    const el = document.createElement('div');
    el.className = 'typing';
    el.id = 'typing';
    el.innerHTML = `
      <div class="avatar">SF</div>
      <div class="typing-dots">
        <span></span><span></span><span></span>
      </div>
    `;
    chatEl.appendChild(el);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function hideTyping() {
    const el = document.getElementById('typing');
    if (el) el.remove();
  }

  function escapeHtml(text) {
    return text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/\n/g, '<br>');
  }

  async function sendMessage() {
    const message = inputEl.value.trim();
    if (!message || isLoading) return;

    isLoading = true;
    sendBtn.disabled = true;
    inputEl.value = '';
    inputEl.style.height = 'auto';

    addMessage('user', message);
    showTyping();

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: sessionId, message }),
      });

      const data = await res.json();
      hideTyping();
      addMessage('agent', data.reply);

    } catch (err) {
      hideTyping();
      addMessage('agent', '오류가 발생했습니다. 다시 시도해주세요.');
    } finally {
      isLoading = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  async function resetSession() {
    await fetch(`/session/${sessionId}`, { method: 'DELETE' });
    location.reload();
  }
</script>
</body>
</html>
